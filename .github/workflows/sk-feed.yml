name: SK Daten-Sammler
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: sk-feed
  cancel-in-progress: false
jobs:
  feed:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sk-board-pages
          path: app
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Daten-Branch holen
        run: |
          URL="https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git clone --depth 1 --branch sk-data "$URL" data 2>/dev/null || (mkdir data && cd data && git init -q -b sk-data && git remote add origin "$URL")
      - name: Sammler starten
        run: |
          cd app && npm install --no-save ws
          OUT_DIR="$GITHUB_WORKSPACE/data" COLLECT_SEC=470 node scanner/feed.js
      - name: Daten speichern
        run: |
          cd data
          git config user.name "sk-feed"
          git config user.email "sk-feed@users.noreply.github.com"
          git add -A
          git commit -q --amend -m "Sammler-Daten" 2>/dev/null || git commit -q -m "Sammler-Daten"
          git push --force origin sk-data
